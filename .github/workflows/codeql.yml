name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '11 3 * * 1'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@84486af028f18f4a2d93ee5c4eb954fdd541d800 # v1.31.10
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'