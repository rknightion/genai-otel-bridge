name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '11 3 * * 1'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@f004054afb6aa07bf613b539546dbf870015be17 # v1.30.32
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'