# Publish the multi-arch image + Helm chart to GHCR via the shared rknightion
# container-publish reusable (native amd64+arm64 matrix, cosign signing, provenance,
# syft SPDX+CycloneDX SBOM, Trivy, OCI Helm chart publish). Triggers: push to main
# publishes the edge :main image + main-snapshot chart (release_tag empty), GATED on
# ci.yml's `ci-success` check for that same commit (see wait-for-ci below — a red
# ci-success must never let a broken build reach the edge tag / snapshot chart that
# dev EKS ArgoCD tracks); called by release-please.yml when a release is created
# (release_tag set) and by auto-rc.yml for a release candidate; also
# workflow_dispatch-able: leave release_tag empty for an edge (:main) test build, or
# set it to re-publish a tag. In a called workflow github.event_name is the caller's
# event, so the release-please call (a push) waits for ci-success too; the auto-rc
# call (workflow_run, fired by CI's completion) and a manual dispatch skip the wait.
name: publish

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish, e.g. v1.2.3"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (vX.Y.Z) to publish; empty = edge (:main) test build"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# A release merge runs this workflow twice for one commit: its own push trigger (edge)
# and the release-please call (release). Both push to the same image repository and
# both write the :main tags, so they take turns, never cancelling. Only push-event
# runs share a group, keyed on the pushed commit, and a group can hold at most those
# two: one push of a commit to main means one edge run and at most one release-please
# run, and a re-run attempt starts only after its earlier attempt has finished.
# GitHub keeps one pending run per group and cancels an older pending one when a
# third arrives, so any path that could add a third member must not join: the
# auto-rc call (workflow_run) and a manual dispatch get a group of their own run.
# They can still overlap an edge or release publish. That is safe: each run pushes
# its own digests and a complete, signed index, every build of a commit passes the
# same Trivy gate, and a tag both write (:main, main-<sha>) ends on one of those
# complete indexes for the same commit. auto-rc never cuts an RC on a stable release
# commit, so an RC and a release of one commit do not meet.
concurrency:
  group: publish-${{ github.event_name == 'push' && format('commit-{0}', github.sha) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Gate the publish on CI actually being green for this exact commit. Runs whenever
  # github.event_name is `push`: the edge path and the release-please call, whose event
  # is the caller's push (github.sha there is the pushed commit). The auto-rc call
  # (workflow_run, which only fires once CI has concluded green) and a manual dispatch
  # skip it, so this job's result is `skipped` there and `image` proceeds at once.
  wait-for-ci:
    name: wait-for-ci-success
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Poll the ci-success check for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for the ci-success check on ${SHA}..."
          for i in $(seq 1 90); do
            # One request, filtered server-side by name: an unfiltered list is paged at
            # 30 and this commit can carry more check runs than that, and reading status
            # and conclusion from two requests can see a check complete in between.
            if ! state=$(gh api \
              "repos/${REPO}/commits/${SHA}/check-runs?check_name=ci-success&per_page=100" \
              --jq '[.check_runs[]] | last | "\(.status // "") \(.conclusion // "")"'); then
              echo "check-runs request failed; sleeping 30s (${i}/90)"
              sleep 30
              continue
            fi
            read -r status conclusion <<< "${state}"
            if [ "${status}" = "completed" ]; then
              echo "ci-success conclusion: ${conclusion}"
              if [ "${conclusion}" = "success" ]; then
                exit 0
              fi
              echo "ci-success did not succeed (conclusion=${conclusion}) — refusing to publish"
              exit 1
            fi
            echo "ci-success not yet completed (status=${status:-not started}); sleeping 30s (${i}/90)"
            sleep 30
          done
          echo "Timed out waiting for ci-success to complete"
          exit 1

  image:
    needs: [wait-for-ci]
    if: always() && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped')
    permissions:
      contents: write        # SBOMs + chart attached to the release (when release_tag set)
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: rknightion/.github/.github/workflows/container-publish.yml@9278035a95cca2de3e202817e536fc7f9fc774fc # v1.34.0
    with:
      release-tag: ${{ inputs.release_tag }}
      trivy-ignore-unfixed: true
      helm-chart-path: deploy/helm

  # go-licenses third-party notices (Go-specific; migrates to the shared binaries
  # reusable later). Releases only.
  notices:
    if: inputs.release_tag != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - name: Generate + attach third-party notices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          just notices
          gh release upload "${RELEASE_TAG}" THIRD_PARTY_NOTICES.md --clobber
