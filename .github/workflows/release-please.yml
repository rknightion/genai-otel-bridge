# Release automation. On every push to main, release-please maintains a "release PR" that accrues
# changes and, from the Conventional Commits since the last release, computes the next semver and
# updates CHANGELOG.md + deploy/helm/Chart.yaml (version + appVersion). Merging that PR tags vX.Y.Z,
# creates the GitHub Release (notes = that version's changelog section), and triggers the publish below.
#
# NB: publish runs HERE, gated on release_created, not from a v* tag-push event, so the release image
# and chart come from this same run. The release PR is opened with a short-lived GitHub App installation
# token minted for this repository (the broker-token step below), not with GITHUB_TOKEN, so CI runs on it
# like any other pull request. Merge it once ci-success is green, as for any other pull request; its
# content (changelog + version bump) was already validated when the underlying commits landed.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual re-trigger (e.g. after a config change)

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release commit, tag, and GitHub Release
      pull-requests: write      # open/update the release PR
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Mints a short-lived GitHub App installation token scoped to THIS repo,
      # replacing RELEASE_PLEASE_TOKEN -- a PAT scoped across every rknightion repo.
      # Nothing durable is stored here to leak. The release PR's author becomes the
      # App rather than rknightion; CI still runs unattended on it, because the
      # action_required gate applies to github-actions[bot], not to bot identities
      # generally -- Renovate, a GitHub App, already runs fine.
      #
      # Releases now depend on the token broker host being up, unsealed and on
      # the tailnet; a failure here is infrastructure, not the commit.
      - name: Mint a scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0
        with:
          permission-set: release-please-genai-otel-bridge
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.bao.outputs.token }}

  # Build + push the image and chart for the freshly-created tag. Same run as the merge that created it.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write        # attach SBOMs + third-party notices + chart to the GitHub Release
      packages: write
      id-token: write         # cosign keyless signing + provenance attestation
      attestations: write
      security-events: write  # Trivy SARIF upload
      checks: read            # publish.yml's wait-for-ci job reads the ci-success check. It runs on
                              # this path: in a called workflow github.event_name is the caller's
                              # (push). A called workflow's job perms must be within the caller's
                              # grant or the whole run dies at startup (startup_failure).
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}