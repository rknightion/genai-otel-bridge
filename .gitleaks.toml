# gitleaks config — extend the upstream default ruleset, allowlist intentional placeholders.
# Used by the secret-scan CI job (scripts run `gitleaks detect`).
[extend]
useDefault = true

[allowlist]
description = "intentional placeholder/example values, not real secrets"
paths = [
  '''scripts/forbidden-words\.local\.example''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "removed historical overlay contained a non-secret workspace identifier"
commits = ["6d36d1d6239768b9abf413e7cb6561659d68f323"]
