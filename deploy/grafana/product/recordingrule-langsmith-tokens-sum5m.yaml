apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  name: genai-otel-bridge-langsmith-tokens-sum5m
  annotations:
    grafana.app/folder: genai-otel-bridge
  labels:
    grafana.app/folder: genai-otel-bridge
spec:
  title: langsmith:tokens:sum_5m
  metric: langsmith:tokens:sum_5m
  targetDatasourceUID: grafanacloud-prom
  trigger:
    interval: 1m
  expressions:
    query:
      datasourceUID: grafanacloud-prom
      queryType: prometheus
      source: true
      relativeTimeRange: {from: 5m0s, to: 0s}
      model:
        datasource: {type: prometheus, uid: grafanacloud-prom}
        # DEPRECATED: use langsmith:tokens:window_total. This rule is kept for one release and then removed.
        # It is mis-named: langsmith_tokens is an aggregate-now gauge (each poll emits the trailing
        # settings.stats_window total, default 1h), so sum_over_time over 5m adds overlapping window totals
        # and overstates the value (about 5x at a 1m cadence), and is NOT a 5 minute sum.
        expr: 'sum by (deployment_environment_name, service_namespace) (sum_over_time(langsmith_tokens[5m]))'
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: query
