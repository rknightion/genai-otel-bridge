apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: genai-otel-bridge-export-pipeline-data-incomplete
  annotations:
    grafana.app/folder: genai-otel-bridge
  labels:
    grafana.app/folder: genai-otel-bridge
spec:
  title: GenaiOtelBridgeExportPipelineDataIncomplete
  execErrState: Ok
  noDataState: Ok
  for: 0s
  trigger:
    interval: 1m
  labels:
    # export_failed/export_stuck mean the export pipeline cannot produce its target's data.
    severity: critical
  annotations:
    summary: "genai-otel-bridge {{ $labels.loop }} export pipeline has incomplete data ({{ $labels.reason }})"
    description: "genai_otel_bridge_source_data_incomplete_total{reason=\"{{ $labels.reason }}\"} increased for the {{ $labels.loop }} loop in the last 15m. export_failed/export_stuck mean the export-job lifecycle cannot produce the target's data; check export-job status plus retry/backoff behaviour. See deploy/grafana/README.md."
  expressions:
    query:
      datasourceUID: grafanacloud-prom
      queryType: prometheus
      relativeTimeRange: {from: 16m0s, to: 0s}
      model:
        datasource: {type: prometheus, uid: grafanacloud-prom}
        expr: 'sum by (loop, reason) (increase(genai_otel_bridge_source_data_incomplete_total{reason=~"export_failed|export_stuck"}[15m])) > 0'
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: query
    prometheus_math:
      queryType: math
      model:
        datasource: {type: __expr__, uid: __expr__, name: __expr__}
        expression: 'is_number($query) || is_nan($query) || is_inf($query)'
        type: math
        refId: prometheus_math
        intervalMs: 1000
        maxDataPoints: 43200
    threshold:
      queryType: threshold
      source: true
      model:
        datasource: {type: __expr__, uid: __expr__, name: __expr__}
        expression: prometheus_math
        type: threshold
        refId: threshold
        conditions: [{evaluator: {type: gt, params: [0]}}]
        intervalMs: 1000
        maxDataPoints: 43200
