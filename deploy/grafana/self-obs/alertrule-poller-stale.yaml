apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: genai-otel-bridge-poller-stale
  annotations:
    grafana.app/folder: genai-otel-bridge
  labels:
    grafana.app/folder: genai-otel-bridge
spec:
  title: GenaiOtelBridgePollerStale
  # A loop is still exporting its self-metrics (process up) but it is stale. Two arms, either one fires:
  #  1. relative: last-success age > 2x its own trailing-6h p90 baseline AND the 300s floor — staler than
  #     normal for THIS loop. Self-relative so fast loops fire quickly while slow log-export loops don't
  #     false-positive.
  #  2. absolute: last-success age > 10800s (3h). A permanent stall drags the trailing p90 up with it
  #     (once the stall passes ~36m the p90 is itself a stalled sample, so arm 1 turns false at about
  #     72m of stall and the alert would resolve with the loop still dead). The ceiling sits above the
  #     slowest healthy sawtooth of any loop (tens of minutes; a 50m sawtooth is covered by
  #     sim_poller_stale.py) and is the backstop arm 1 cannot erase.
  # Scope gate (multi-tenant shape): a pipeline is judged only while genai_otel_bridge_scope_state{state="matched"}
  # is 1 for it (the "and on (tenant, pipeline)" join), because an unverified or mismatched pipeline is held
  # back on purpose and its age grows by design. The second branch (tenant="") keeps a series with no tenant
  # label, a legacy install, judged exactly as before. sim_poller_stale.py proves the gate's arithmetic.
  # The "leader entirely gone" case (no series at all) is covered by GenaiOtelBridgeLeaderAbsent, hence
  # noData=Ok here.
  execErrState: Ok
  noDataState: Ok
  for: 15m
  trigger:
    interval: 1m
  labels:
    severity: warning
  annotations:
    summary: "genai-otel-bridge {{ $labels.loop }} loop is stale vs its own baseline"
    description: "The {{ $labels.loop }} loop's last-success age has exceeded 2x its own trailing-6h p90 baseline AND the 300s floor (staler than normal for this loop, so it won't false-positive on the slow log-export loops), OR exceeded the 3h absolute ceiling (a long stall absorbs the relative baseline, so the ceiling keeps the alert firing). The loop is not advancing its watermark: collect/emit is wedged or the source is failing. Check genai_otel_bridge_emit_errors_total / genai_otel_bridge_window_lag_seconds and the pod logs. See deploy/grafana/README.md."
  expressions:
    query:
      datasourceUID: grafanacloud-prom
      queryType: prometheus
      relativeTimeRange: {from: 6h0s, to: 0s}
      model:
        datasource: {type: prometheus, uid: grafanacloud-prom}
        expr: '((((time() - max by (tenant, pipeline, source, loop) (genai_otel_bridge_last_success_timestamp_seconds)) and on (tenant, pipeline) (max by (tenant, pipeline) (genai_otel_bridge_scope_state{state="matched"}) == 1)) > (2 * quantile_over_time(0.9, ((time() - max by (tenant, pipeline, source, loop) (genai_otel_bridge_last_success_timestamp_seconds)) and on (tenant, pipeline) (max by (tenant, pipeline) (genai_otel_bridge_scope_state{state="matched"}) == 1))[6h:1m])) and ((time() - max by (tenant, pipeline, source, loop) (genai_otel_bridge_last_success_timestamp_seconds)) and on (tenant, pipeline) (max by (tenant, pipeline) (genai_otel_bridge_scope_state{state="matched"}) == 1)) > 300) or ((time() - max by (tenant, pipeline, source, loop) (genai_otel_bridge_last_success_timestamp_seconds)) and on (tenant, pipeline) (max by (tenant, pipeline) (genai_otel_bridge_scope_state{state="matched"}) == 1)) > 10800) or (((time() - max by (tenant, pipeline, source, loop) (genai_otel_bridge_last_success_timestamp_seconds{tenant=""})) > (2 * quantile_over_time(0.9, (time() - max by (tenant, pipeline, source, loop) (genai_otel_bridge_last_success_timestamp_seconds{tenant=""}))[6h:1m])) and (time() - max by (tenant, pipeline, source, loop) (genai_otel_bridge_last_success_timestamp_seconds{tenant=""})) > 300) or (time() - max by (tenant, pipeline, source, loop) (genai_otel_bridge_last_success_timestamp_seconds{tenant=""})) > 10800)'
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: query
    prometheus_math:
      queryType: math
      model:
        datasource: {type: __expr__, uid: __expr__, name: __expr__}
        expression: 'is_number($query) || is_nan($query) || is_inf($query)'
        type: math
        refId: prometheus_math
        intervalMs: 1000
        maxDataPoints: 43200
    threshold:
      queryType: threshold
      source: true
      model:
        datasource: {type: __expr__, uid: __expr__, name: __expr__}
        expression: prometheus_math
        type: threshold
        refId: threshold
        conditions: [{evaluator: {type: gt, params: [0]}}]
        intervalMs: 1000
        maxDataPoints: 43200
