apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: genai-otel-bridge-queue-backpressure
  annotations:
    grafana.app/folder: genai-otel-bridge
  labels:
    grafana.app/folder: genai-otel-bridge
spec:
  title: GenaiOtelBridgeQueueBackpressure
  # A loop has had a batch in flight (queue_depth = 1) for a sustained 15m. Collection is single-flight
  # with the emit, so at most one batch is ever queued or in flight per loop: the gauge is 1 while that
  # batch is being emitted and committed, else 0. In normal operation the emit completes well within the
  # tick interval, so a sustained 1 means the emit is slow or failing (OTLP backend slow or rejecting, or
  # the emit retry budget is being spent). No backlog builds up meanwhile: the loop skips its ticks.
  execErrState: Ok
  noDataState: Ok
  for: 15m
  trigger:
    interval: 1m
  labels:
    severity: warning
  annotations:
    summary: "genai-otel-bridge {{ $labels.loop }} loop has had a batch in flight for 15m"
    description: "genai_otel_bridge_queue_depth_ratio for the {{ $labels.loop }} loop has been 1 for 15m: one batch has been in flight for the whole period, so its emit is slow or failing. Healthy operation is 0 between emits. Check emit latency / OTLP backend availability / genai_otel_bridge_emit_errors_total. The loop collects nothing new while the batch is in flight, so window_lag rises and windows past max_backfill are eventually skipped (counted). See deploy/grafana/README.md."
  expressions:
    query:
      datasourceUID: grafanacloud-prom
      queryType: prometheus
      relativeTimeRange: {from: 16m0s, to: 0s}
      model:
        datasource: {type: prometheus, uid: grafanacloud-prom}
        expr: 'max by (tenant, pipeline, source, loop) (genai_otel_bridge_queue_depth_ratio) > 0'
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: query
    prometheus_math:
      queryType: math
      model:
        datasource: {type: __expr__, uid: __expr__, name: __expr__}
        expression: 'is_number($query) || is_nan($query) || is_inf($query)'
        type: math
        refId: prometheus_math
        intervalMs: 1000
        maxDataPoints: 43200
    threshold:
      queryType: threshold
      source: true
      model:
        datasource: {type: __expr__, uid: __expr__, name: __expr__}
        expression: prometheus_math
        type: threshold
        refId: threshold
        conditions: [{evaluator: {type: gt, params: [0]}}]
        intervalMs: 1000
        maxDataPoints: 43200
