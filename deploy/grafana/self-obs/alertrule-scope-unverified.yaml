apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: genai-otel-bridge-scope-unverified
  annotations:
    grafana.app/folder: genai-otel-bridge
  labels:
    grafana.app/folder: genai-otel-bridge
spec:
  title: GenaiOtelBridgeScopeUnverified
  # A pipeline has been unverified for a full day: its scope gate has had no matched or mismatched result, so it has
  # not collected. Low severity, because a short unverified spell is normal at start-up or during an upstream outage
  # (GenaiOtelBridgeScopeAssertionErrors covers a stuck pipeline sooner). Max across replicas; no data is healthy.
  execErrState: Ok
  noDataState: Ok
  for: 24h
  trigger:
    interval: 1m
  labels:
    severity: info
  annotations:
    summary: "genai-otel-bridge pipeline {{ $labels.pipeline }} of tenant {{ $labels.tenant }} has been unverified for 24h"
    description: "The scope gate has reported unverified for pipeline {{ $labels.pipeline }} (tenant {{ $labels.tenant }}) for 24h. The pipeline has not collected since it was unverified. Check the credential, the upstream status and GenaiOtelBridgeScopeAssertionErrors. See deploy/grafana/README.md."
  expressions:
    query:
      datasourceUID: grafanacloud-prom
      queryType: prometheus
      relativeTimeRange: {from: 6m0s, to: 0s}
      model:
        datasource: {type: prometheus, uid: grafanacloud-prom}
        expr: 'max by (tenant, pipeline) (genai_otel_bridge_scope_state{state="unverified"}) == 1'
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: query
    prometheus_math:
      queryType: math
      model:
        datasource: {type: __expr__, uid: __expr__, name: __expr__}
        expression: 'is_number($query) || is_nan($query) || is_inf($query)'
        type: math
        refId: prometheus_math
        intervalMs: 1000
        maxDataPoints: 43200
    threshold:
      queryType: threshold
      source: true
      model:
        datasource: {type: __expr__, uid: __expr__, name: __expr__}
        expression: prometheus_math
        type: threshold
        refId: threshold
        conditions: [{evaluator: {type: gt, params: [0]}}]
        intervalMs: 1000
        maxDataPoints: 43200
