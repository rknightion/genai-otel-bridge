apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: genai-otel-bridge-tenant-blocked
  annotations:
    grafana.app/folder: genai-otel-bridge
  labels:
    grafana.app/folder: genai-otel-bridge
spec:
  title: GenaiOtelBridgeTenantBlocked
  # A tenant is blocked from running (its secret cannot be read, or its API key duplicates another tenant's), so
  # none of its pipelines start. The gauge is per tenant and carries the reason, not a pipeline. Max across replicas.
  # A tenant with no data is healthy.
  execErrState: Ok
  noDataState: Ok
  for: 5m
  trigger:
    interval: 1m
  labels:
    severity: critical
  annotations:
    summary: "genai-otel-bridge tenant {{ $labels.tenant }} is blocked ({{ $labels.reason }})"
    description: "Tenant {{ $labels.tenant }} has been blocked for 5m (reason {{ $labels.reason }}): genai_otel_bridge_tenant_blocked is 1, so none of its pipelines run. secret_unreadable means a credential file is missing or empty; duplicate_key means two tenants share an API key. See deploy/grafana/README.md."
  expressions:
    query:
      datasourceUID: grafanacloud-prom
      queryType: prometheus
      relativeTimeRange: {from: 6m0s, to: 0s}
      model:
        datasource: {type: prometheus, uid: grafanacloud-prom}
        expr: 'max by (tenant, reason) (genai_otel_bridge_tenant_blocked) == 1'
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: query
    prometheus_math:
      queryType: math
      model:
        datasource: {type: __expr__, uid: __expr__, name: __expr__}
        expression: 'is_number($query) || is_nan($query) || is_inf($query)'
        type: math
        refId: prometheus_math
        intervalMs: 1000
        maxDataPoints: 43200
    threshold:
      queryType: threshold
      source: true
      model:
        datasource: {type: __expr__, uid: __expr__, name: __expr__}
        expression: prometheus_math
        type: threshold
        refId: threshold
        conditions: [{evaluator: {type: gt, params: [0]}}]
        intervalMs: 1000
        maxDataPoints: 43200
