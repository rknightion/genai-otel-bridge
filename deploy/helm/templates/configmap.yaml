apiVersion: v1
kind: ConfigMap
metadata:
  name: genai-otel-bridge-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "genai-otel-bridge.labels" . | nindent 4 }}
data:
  # config.yaml is either the verbatim .Values.configOverride string (e.g. a fully-resolved e2e
  # config) or, by default, the generated default config map (.Values.config) serialised back to
  # YAML. The generated map lives in values.yaml and is produced from the Go schema by `just
  # gen` (see internal/config/gen). ${ENV} refs are scalar strings and survive toYaml intact;
  # they are injected from the genai-otel-bridge-secrets Secret via envFrom at runtime.
  config.yaml: |
{{- if .Values.configOverride }}
{{ .Values.configOverride | indent 4 }}
{{- else if .Values.config.tenants }}
{{- /* Tenant shape: sources and emit.telemetry belong to the legacy shape and must be absent. */}}
{{- $config := omit .Values.config "sources" }}
{{- $_ := set $config "emit" (omit (get $config "emit" | default dict) "telemetry") }}
{{ $config | toYaml | indent 4 }}
{{- else }}
{{ .Values.config | toYaml | indent 4 }}
{{- end }}
