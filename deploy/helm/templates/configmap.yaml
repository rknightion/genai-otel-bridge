apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "genai-otel-bridge.configName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "genai-otel-bridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-revision
immutable: true
data:
  # A quoted scalar preserves the hash input byte for byte. A block scalar would normalise
  # CRLF, strip leading indent and change trailing newlines in a verbatim configOverride.
  config.yaml: {{ include "genai-otel-bridge.configBytes" . | toJson }}
{{- /* On the first live upgrade, preserve the fixed-name map without replacing its bytes.
       Helm otherwise deletes it while old pods and ReplicaSets still refer to it. */ -}}
{{- if .Release.IsUpgrade }}
{{- with lookup "v1" "ConfigMap" .Release.Namespace "genai-otel-bridge-config" }}
{{- $annotations := .metadata.annotations | default dict }}
{{- $labels := .metadata.labels | default dict }}
{{- if and (eq (get $annotations "meta.helm.sh/release-name") $.Release.Name) (eq (get $annotations "meta.helm.sh/release-namespace") $.Release.Namespace) -}}
{{- if not (and (eq (get $labels "app.kubernetes.io/component") "config-revision") (eq (get $annotations "helm.sh/resource-policy") "keep")) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: genai-otel-bridge-config
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "genai-otel-bridge.labels" $ | nindent 4 }}
    app.kubernetes.io/component: config-revision
{{- with .data }}
data: {{ toJson . }}
{{- end }}
{{- with .binaryData }}
binaryData: {{ toJson . }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
