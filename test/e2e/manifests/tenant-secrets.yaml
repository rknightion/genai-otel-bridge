# The tenant phase's Secrets (scripts/k3d-e2e.sh run_tenant_tests applies this file with -n "$E2E_NAMESPACE";
# it carries no namespace). One per tenant of values-e2e-tenants.yaml except team-d, which has none so
# that it is blocked as secret_unreadable. The chart mounts genai-otel-bridge-tenant-<tenant id> at
# /var/run/secrets/genai-otel-bridge/tenants/<tenant id>/. The values are dummies: source-key is the
# mock Portkey's key for the tenant (test/e2e/harness apiKeys) and otlp-token the token the loopback sink
# records with the destination's instance id.
---
apiVersion: v1
kind: Secret
metadata:
  name: genai-otel-bridge-tenant-team-a
stringData:
  otlp-token: "e2e-token-team-a"
  source-key: "e2e-key-team-a"
---
apiVersion: v1
kind: Secret
metadata:
  name: genai-otel-bridge-tenant-team-b
stringData:
  otlp-token: "e2e-token-team-b"
  source-key: "e2e-key-team-b"
---
apiVersion: v1
kind: Secret
metadata:
  name: genai-otel-bridge-tenant-team-c
stringData:
  otlp-token: "e2e-token-team-c"
  source-key: "e2e-key-team-c"
