---
# Source: genai-otel-bridge/templates/networkpolicy.yaml
# NetworkPolicy: default-deny all egress, then permit DNS + OTLP + source API egress.
#
# [CP-H10] IMPORTANT — standard Kubernetes NetworkPolicy is CIDR/label-based and CANNOT
# match FQDNs (hostnames) like "api.portkey.ai". The rules below use CIDR ranges as
# placeholders. In production you have two options:
#
#   1. Widen to the provider's published CIDR ranges (e.g. Portkey's EIP allocation,
#      Grafana Cloud's published egress IPs) and set them in values.yaml.
#
#   2. Use a CNI with FQDN-aware policy. For example, Cilium's CiliumNetworkPolicy
#      supports `toFQDNs` rules that resolve the hostname and follow CNAME chains:
#
#        apiVersion: cilium.io/v2
#        kind: CiliumNetworkPolicy
#        metadata:
#          name: genai-otel-bridge-egress
#          namespace: <namespace>
#        spec:
#          endpointSelector:
#            matchLabels:
#              app: genai-otel-bridge
#          egressDeny: []    # default-deny covered by CiliumClusterWideNetworkPolicy
#          egress:
#            - toFQDNs:
#                - matchName: "api.portkey.ai"
#                - matchName: "otlp-gateway-<region>.grafana.net"   # your Grafana Cloud OTLP host
#                - matchName: "<your-signed-url-host>"   # Portkey logs_export's S3 signed-download
#                                                          # host (DIFFERENT from api.portkey.ai —
#                                                          # see config sources[].loops.logs_export.settings.signed_url_allow_hosts
#                                                          # and values.yaml networkPolicy.exportEgressCIDR)
#              toPorts:
#                - ports:
#                    - port: "443"
#                      protocol: TCP
#            - toEndpoints:
#                - matchLabels:
#                    k8s:io.kubernetes.pod.namespace: kube-system
#              toPorts:
#                - ports:
#                    - port: "53"
#                      protocol: UDP
#                    - port: "53"
#                      protocol: TCP
#
#      Without a CNI like Cilium, enforce FQDN egress at the mesh or cluster egress layer
#      (e.g. Istio AuthorizationPolicy, AWS Security Group, GCP VPC firewall rules).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: genai-otel-bridge
  namespace: default
  labels:
    app: genai-otel-bridge
    app.kubernetes.io/name: genai-otel-bridge
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app: genai-otel-bridge

  policyTypes:
    - Ingress
    - Egress

  # Ingress: deny everything EXCEPT the health port (open to all, CP-H10c) and, in pull-mode
  # profiling, the pprof port (open ONLY to profiling.pullFrom — see below). The pod serves no other
  # listener — self-metrics are PUSHED via OTLP (selfobs PeriodicReader), nothing scrapes it — so the
  # only legitimate from-anywhere inbound is the kubelet's liveness/readiness probe on 8080.
  #
  # [CP-H10c] We allow the health port from ALL sources (empty `from:`) rather than default-deny-all
  # ingress. kubelet probes originate from the node's host netns; whether a default-deny ingress rule
  # blocks them is CNI-dependent (a documented Cilium/VPC-CNI footgun), and there is no portable
  # selector for "the node".
  #
  # [issue #127] The above justification does NOT extend to pprof: unlike the kubelet, pprof is
  # scraped by a normal cluster pod (a Grafana Alloy/k8s-monitoring pod, typically) that IS
  # selectable by namespace/pod labels. Appending pprof to the same empty-`from:` health rule let ANY
  # pod in the cluster hit /debug/pprof/* — cheap CPU-profile-triggered DoS or recon of a process
  # holding vendor API keys in memory. So pprof is rendered as its OWN ingress rule with a `from:`
  # peer selector (profiling.pullFrom), never appended to the from-anywhere health rule.
  # Numeric ports (not named): NetworkPolicy named-port resolution is inconsistent across CNIs, so we
  # match the literal port the way the egress rules do. networkPolicy.ingressPorts defaults to just the
  # integrator's health listener (8080); widen it only for extra sidecar listeners that the kubelet (or
  # another pod) must reach — e.g. the e2e's loopback sink/mock probe ports.
  # [CP-H10d] An empty ingressPorts list MUST mean deny-all, not allow-all. A NetworkPolicy ingress
  # rule with a null/empty `ports:` (and no `from:`) matches ALL ports from ALL peers — the exact
  # inverse of the intent. So render the health-port rule ONLY when ingressPorts is non-empty; emit
  # `ingress: []` only when there is NOTHING to allow (no ingressPorts AND pprof not enabled), which
  # with policyTypes:[Ingress] is a true default-deny-all-ingress.
  ingress:
    - ports:
        - protocol: TCP
          port: 8080

  egress:
    # DNS: select the cluster DNS pods (CoreDNS/kube-dns) in kube-system by LABEL, not CIDR.
    # [CP-H10b] A CIDR rule is fragile here: kube-router/Calico evaluate egress on the POST-DNAT
    # CoreDNS *pod* IP (in the pod CIDR), not the kube-dns service IP — so a service-CIDR rule
    # silently blocks DNS (observed on k3s). A namespace+pod selector is portable across CNIs.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Kubernetes API server egress — REQUIRED for Lease leader election and the ConfigMap watermark
    # checkpoint. Kept SEPARATE from the OTLP rule so the OTLP CIDR can be tightened to Grafana
    # Cloud's egress range without silently breaking control-plane access (otherwise leader election
    # fails). Set apiServerCIDR to your API server endpoint range (default 0.0.0.0/0 — tighten per env).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

    # Product OTLP gateway egress (emit.telemetry → the product stack, port 443). Under PrivateLink this
    # is your in-VPC endpoint CIDR; over the public internet it's Grafana Cloud's regional egress CIDR.
    # Kept separate from selfOtlpEgressCIDR so product and self-o11y can target different endpoints.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

    # Source API egress (e.g. Portkey public Analytics API, in-VPC LangSmith, etc.).
    # Replace values.networkPolicy.sourceEgressCIDR with the CIDR of your source endpoints.
    # For FQDN-based control (api.portkey.ai), use Cilium toFQDNs — see header comment above.
    # [issue #128] Portkey's logs_export loop downloads export objects from a signed S3 URL on a
    # DIFFERENT host than the control-plane API matched here (config sources[].loops.logs_export.settings.signed_url_allow_hosts;
    # see internal/source/portkey/AGENTS.md and docs/DESIGN.md §4.7). Tightening this CIDR to just the
    # control-plane API's range WITHOUT also allowing that S3 host stalls logs_export downloads — set
    # networkPolicy.exportEgressCIDR below to cover it as a separate, independently-tightenable rule.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

---
# Source: genai-otel-bridge/templates/pdb.yaml
# PodDisruptionBudget: bound VOLUNTARY disruption (node drain, cluster-autoscaler/Karpenter
# consolidation) so it can't evict all replicas at once. This service is on the telemetry critical
# path — losing every replica simultaneously is a polling+emit gap until reschedule. maxUnavailable:1
# forces the eviction API to serialise drains, keeping a warm standby alive to take the Lease.
#
# maxUnavailable (not minAvailable) is deliberate: it is a no-op at replicas:1 (the single dev pod is
# still evictable, no drain deadlock), and serialises drains at replicas:3.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: genai-otel-bridge
  namespace: default
  labels:
    app: genai-otel-bridge
    app.kubernetes.io/name: genai-otel-bridge
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: genai-otel-bridge

