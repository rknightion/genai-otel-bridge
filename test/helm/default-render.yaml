# Source: genai-otel-bridge/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-otel-bridge
  namespace: default
  labels:
    app: genai-otel-bridge
    app.kubernetes.io/name: genai-otel-bridge
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  revisionHistoryLimit: 3
  # RollingUpdate bounded to one pod at a time: with leader election only one replica is active, so a
  # surge+drain of one pod at a time keeps a healthy standby ready to take the Lease throughout a roll.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: genai-otel-bridge
  template:
    metadata:
      labels:
        app: genai-otel-bridge
        app.kubernetes.io/name: genai-otel-bridge
        app.kubernetes.io/instance: rel
        app.kubernetes.io/managed-by: Helm
      annotations:
        # Retain the optional checksum for tooling. The volume reference now drives config rollouts.
    spec:
      serviceAccountName: genai-otel-bridge

      # Pod-level security: non-root UID 65532 (distroless default), RuntimeDefault seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      # Spread pods across nodes AND availability zones so neither a node nor an AZ failure takes both
      # the leader and the standby. ScheduleAnyway (not DoNotSchedule) — scheduling must never block:
      # strict spreading would prevent startup on a single-node/single-AZ cluster (e.g. dev). On a
      # multi-AZ EKS cluster this lands the standby in a different AZ; on a 1-node dev cluster it's a no-op.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: genai-otel-bridge
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: genai-otel-bridge

      containers:
        - name: genai-otel-bridge
          # Image defaults to this chart's appVersion; see the genai-otel-bridge.image helper.
          imagePullPolicy: IfNotPresent
          args:
            - "-config=/etc/genai-otel-bridge/config.yaml"
            - "-namespace=$(POD_NAMESPACE)"
            - "-identity=$(POD_NAME)"
            - "-container-mem-bytes=$(MEM_LIMIT)"

          env:
            # Downward API: pod identity for the Lease holder name and self-metric instance label.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Replica count: the binary fatals on ha.coordinator=none + replicas>1 (all-leader
            # double-emit guard) — defence-in-depth with the chart-render guard at the top of this file.
            - name: GENAI_OTEL_BRIDGE_REPLICAS
              value: "2"
            # GOMEMLIMIT: derived from the container's own memory limit at runtime (resourceFieldRef).
            # The binary multiplies by 0.9 to leave headroom for GC overhead (DESIGN §4.1).
            - name: MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: genai-otel-bridge
                  resource: limits.memory
            # Non-secret, environment-specific config consumed as ${ENV} refs in config.yaml. Set these
            # as literal env (NOT secret material) via runtimeEnv.*. Each is rendered ONLY when non-empty;
            # when left empty (the default) the var keeps coming from the genai-otel-bridge-secrets Secret via
            # envFrom below, so the hand-created-secret path is unaffected.

          # Runtime secrets (GC_OTLP_TOKEN, PORTKEY_API_KEY, …) injected from the genai-otel-bridge-secrets
          # Secret. By default this Secret is managed outside the chart (create before deploying); when
          # externalSecrets.enabled is set, it is created and kept in sync by the ExternalSecret
          # (templates/externalsecret.yaml) from a cloud secrets manager.
          envFrom:
            - secretRef:
                name: genai-otel-bridge-secrets

          # Container-level hardening (Cdx-M10 / AR-H-tmp):
          #   readOnlyRootFilesystem: all writable paths are explicit volume mounts below.
          #   drop ALL capabilities: the binary is a pure network poller; it needs none.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Standard requests/limits map, set in values.yaml. GOMEMLIMIT is still derived at runtime
          # from limits.memory via the MEM_LIMIT downward API ref above — independent of how it's set.
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi

          # Health probes. /readyz returns 200 once config is loaded and the health server is up — on
          # BOTH the leader and the standby, at Run start, NOT gated on any collect/emit cycle (a Ready
          # pod may not have emitted yet). This is deliberate: standbys must stay Ready for PDB/rollout
          # purposes. /healthz likewise returns 200 for both leader and standby (so standby pods don't
          # flap — CP-C5). Probe intervals and thresholds are intentionally loose; the liveness
          # threshold (4 failures × 15s = 60s) gives the retry budget time to exhaust before a restart.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4

          ports:
            - containerPort: 8080
              name: health
              protocol: TCP

          volumeMounts:
            # Each pod template pins the immutable revision of its config.yaml.
            - name: config
              mountPath: /etc/genai-otel-bridge
              readOnly: true
            # State dir: used by the dev file-based checkpointer. With the production configmap
            # checkpointer the watermark is stored in a ConfigMap; this emptyDir is harmless but
            # required because readOnlyRootFilesystem=true forbids any unlisted writable path.
            - name: state
              mountPath: /var/lib/genai-otel-bridge
            # /tmp: net/http and the OTLP encoder need a writable /tmp (TLS handshake temp files,
            # proto marshal scratch). [AR-H-tmp] must be explicit under readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: config
          configMap:
            name: genai-otel-bridge-config-295523d247dfea177ee25b143bd067f23ec8087af877ca3a766b2d32b1cac483
        # emptyDir: lost on pod restart, which is correct (the durable watermark is the ConfigMap
        # checkpoint; state/ is only ever written by the dev file checkpointer).
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}

      terminationGracePeriodSeconds: 300
