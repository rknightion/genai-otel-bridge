---
# Source: genai-otel-bridge/templates/rbac.yaml
# Namespaced Role (NOT ClusterRole) — genai-otel-bridge only needs access to resources in its own
# namespace: Leases for leader election, and ConfigMaps for the watermark checkpoint.
# ARCHITECTURE.md §8: keep RBAC minimal and namespace-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: genai-otel-bridge
  namespace: default
  labels:
    app: genai-otel-bridge
    app.kubernetes.io/name: genai-otel-bridge
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
rules:
  # Lease leader election (coordination.k8s.io/leases). create is unscoped because RBAC resourceNames
  # cannot gate create (the object name does not exist yet); get/update are scoped to the single lease.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - genai-otel-bridge-leader
    verbs:
      - get
      - update

  # ConfigMap watermark checkpoint. Same pattern: create unscoped (resourceNames can't gate create),
  # get/update scoped to the checkpoint ConfigMap only — so the pod can NOT read/modify its own
  # genai-otel-bridge-config (or any other ConfigMap) in the namespace.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - genai-otel-bridge-checkpoints
    verbs:
      - get
      - update


