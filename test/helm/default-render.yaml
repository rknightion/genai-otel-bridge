apiVersion: batch/v1
kind: Job
metadata:
  name: genai-otel-bridge-cleanup
  namespace: default
  labels:
    app: genai-otel-bridge
    app.kubernetes.io/name: genai-otel-bridge
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  # Bound the hook so a stuck delete can't hang `helm uninstall` indefinitely (binary self-times-out
  # at 30s; this is the outer ceiling incl. image pull).
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: genai-otel-bridge
    spec:
      serviceAccountName: genai-otel-bridge-cleanup
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          imagePullPolicy: IfNotPresent
          args:
            - "-cleanup"
            - "-namespace=$(POD_NAMESPACE)"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
          volumeMounts:
            # client-go TLS to the API server may need a writable /tmp under readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

